<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rhBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0060c8" />
      <stop offset="60%" stop-color="#004ca8" />
      <stop offset="100%" stop-color="#003580" />
    </linearGradient>
    <linearGradient id="rhShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003d8a" />
      <stop offset="100%" stop-color="#002b66" />
    </linearGradient>
  </defs>

  <!-- Roof Structure -->
  <path d="M 250 65 L 365 155 L 340 155 L 250 85 L 160 155 L 135 155 Z" fill="url(#rhBlue)" />
  <path d="M 135 155 L 155 160 L 155 185 L 135 155 Z" fill="url(#rhBlue)" />
  <path d="M 365 155 L 345 160 L 345 185 L 365 155 Z" fill="url(#rhBlue)" />

  <!-- Attic Window (4 panes) -->
  <rect x="233" y="112" width="14" height="14" fill="url(#rhBlue)" rx="1.5" />
  <rect x="253" y="112" width="14" height="14" fill="url(#rhBlue)" rx="1.5" />
  <rect x="233" y="132" width="14" height="14" fill="url(#rhBlue)" rx="1.5" />
  <rect x="253" y="132" width="14" height="14" fill="url(#rhBlue)" rx="1.5" />

  <!-- Letter R: Left Stem with Batak Gorga Motifs -->
  <path d="M 148 158 L 192 158 L 192 290 L 152 290 C 146 250 148 200 148 158 Z" fill="url(#rhBlue)" />
  
  <!-- Gorga Pattern on R stem (white cutouts) -->
  <g fill="#ffffff">
    <!-- Top triangle & dot -->
    <polygon points="155,166 170,178 155,190" />
    <circle cx="160" cy="178" r="2.5" fill="url(#rhBlue)" />
    
    <!-- Middle diamond X motif -->
    <polygon points="170,185 183,198 170,211 157,198" fill="none" stroke="#ffffff" stroke-width="4.5" />
    <circle cx="170" cy="198" r="3" fill="#ffffff" />
    
    <polygon points="170,215 183,228 170,241 157,228" fill="none" stroke="#ffffff" stroke-width="4.5" />
    <circle cx="170" cy="228" r="3" fill="#ffffff" />
    
    <!-- Bottom triangle & dot -->
    <polygon points="155,248 170,260 155,272" />
    <circle cx="160" cy="260" r="2.5" fill="url(#rhBlue)" />
  </g>

  <!-- Letter R: Bold Sweeping Upper Arch & Loop -->
  <path d="M 175 140 C 230 135 258 155 254 212 C 248 238 230 252 205 254 C 205 235 218 226 220 205 C 224 175 205 160 175 165 Z" fill="url(#rhBlue)" />

  <!-- Letter R: Dramatic Swooping Center Blade Leg -->
  <path d="M 198 224 C 235 228 268 280 308 308 C 265 316 230 286 205 256 C 200 248 198 236 198 224 Z" fill="url(#rhBlue)" />
  <!-- Shading layer on R inner crescent for 3D depth -->
  <path d="M 205 256 C 228 284 260 310 300 308 C 255 304 226 270 205 256 Z" fill="url(#rhShade)" opacity="0.6" />

  <!-- Letter H: Crossbar & Right Pillar -->
  <path d="M 252 225 L 332 225 L 332 248 L 268 248 Z" fill="url(#rhBlue)" />
  <path d="M 252 225 L 268 248 L 250 248 Z" fill="url(#rhShade)" opacity="0.5" />
  <!-- H Right Pillar with flared terminal -->
  <path d="M 330 156 L 354 156 L 354 298 L 330 298 Z" fill="url(#rhBlue)" />

  <!-- Open Book Base Foundation -->
  <!-- Upper page curve -->
  <path d="M 148 304 C 185 300 225 312 250 330 C 275 312 315 300 352 304 C 320 312 280 322 250 348 C 220 322 180 312 148 304 Z" fill="url(#rhBlue)" />
  <!-- Lower page curve -->
  <path d="M 152 316 C 185 314 222 325 250 342 C 278 325 315 314 348 316 C 318 326 280 338 250 360 C 220 338 182 326 152 316 Z" fill="url(#rhBlue)" />
</svg>
